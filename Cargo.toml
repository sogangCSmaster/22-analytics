[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ch",
    "crates/pg",
    "crates/ingest",
    "crates/api",
    "crates/jobs",
    "crates/testkit",
    "crates/web",
    "edge/worker",
]
# web(Dioxus)와 edge(Cloudflare Worker)는 wasm32 타깃으로 따로 빌드한다.
default-members = [
    "crates/testkit",
    "crates/core",
    "crates/ch",
    "crates/pg",
    "crates/ingest",
    "crates/api",
    "crates/jobs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
analytics-core = { path = "crates/core" }
analytics-ch = { path = "crates/ch" }
analytics-pg = { path = "crates/pg" }
analytics-testkit = { path = "crates/testkit" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
url = "2"
woothee = "0.13"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clickhouse = { version = "0.15", features = ["uuid", "time", "inserter"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid", "time", "json", "migrate", "macros"] }
argon2 = "0.6"
clap = { version = "4", features = ["derive", "env"] }
zstd = "0.14"
bytes = "1"
# 서버 바이너리(api·ingest) 전역 할당자: 요청마다 작은 할당이 많아 시스템 malloc보다 빠르다.
mimalloc = "0.1"

# argon2는 디버그 빌드에서 수십 배 느리다 (로그인 테스트·로컬 개발용).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# 서버는 패닉 시 프로세스를 내리고 재시작한다 (언와인딩 코드·표 제거로 바이너리가 작고 빠르다).
# 테스트(dev 프로파일)는 그대로 unwind라 패닉 단언이 동작한다.
panic = "abort"
strip = "symbols"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
# release의 strip = "symbols"를 물려받지 않는다 (이전과 같은 기본값 유지)
strip = "debuginfo"

# 디스크·빌드 시간 절약: 개발·테스트 빌드는 디버그 정보 없이 (백트레이스 줄 번호만 유지)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
