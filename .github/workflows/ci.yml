name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      postgres:
        image: postgres:17-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: analytics
        options: >-
          --health-cmd "pg_isready -U analytics" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://analytics:analytics@localhost:5432/analytics
      CLICKHOUSE_URL: http://localhost:8123
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p analytics-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p analytics-edge --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build -p analytics-edge --target wasm32-unknown-unknown --release
      - run: cargo run -q -p analytics-jobs -- migrate
      - run: cargo test --workspace --exclude analytics-web --exclude analytics-edge
      - run: cargo test -p analytics-web --no-default-features
      - run: cargo test -p analytics-edge

  tracker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [rust, tracker]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      postgres:
        image: postgres:17-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: analytics
        options: >-
          --health-cmd "pg_isready -U analytics" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://analytics:analytics@localhost:5432/analytics
      CLICKHOUSE_URL: http://localhost:8123
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install dioxus-cli@0.7.10 --locked
      - run: cd tracker && npm install
      - run: npm install -g playwright && npx playwright install --with-deps chromium
      - run: cd e2e && NODE_PATH=$(npm root -g) npm test
