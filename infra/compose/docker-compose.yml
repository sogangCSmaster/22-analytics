# 로컬 개발용 의존 서비스. 앱(ingest/api/jobs)은 cargo로 직접 실행한다 (Makefile 참고).
#   make up       # DB 기동
#   make migrate  # 스키마 적용
name: analytics

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "2" }
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/profile.xml:/etc/clickhouse-server/users.d/profile.xml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "2" }
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clickhouse-data:
  postgres-data:
